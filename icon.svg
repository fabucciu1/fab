  <!-- la barre du G est un haltère -->
  <path d="M250 256 H400" stroke="#38e07b" stroke-width="26" stroke-linecap="round"/>
  <rect x="264" y="218" width="24" height="76" rx="8" fill="#38e07b"/>
  <rect x="332" y="218" width="24" height="76" rx="8" fill="#38e07b"/>
</svg>
